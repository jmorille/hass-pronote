name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in one place so the lint job and the test job cannot drift apart.
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install ruff
        run: |
          # Only ruff, not the full test harness: this job must fail in
          # seconds, not after downloading Home Assistant.
          grep -E '^ruff==' requirements-test.txt > /tmp/ruff-req.txt
          pip install -r /tmp/ruff-req.txt

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        # Report-only for now. The existing code was not written with a
        # formatter, so enforcing it today would mean reformatting five of the
        # ten modules in this pull request - a diff that would collide with
        # every open branch and bury the CI change it is meant to deliver.
        # Left visible so the reformat can be done deliberately, on its own.
        continue-on-error: true
        run: ruff format --check --diff .

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install the test harness
        run: pip install -r requirements-test.txt

      - name: pytest
        run: |
          pytest \
            --cov=custom_components/pronote \
            --cov-report=term-missing \
            --cov-report=xml \
            --junit-xml=junit.xml

      - name: Publish the test report
        # Runs even when pytest failed - a failed run is exactly when the
        # report is worth reading.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn
