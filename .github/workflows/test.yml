name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install ruff
        run: |
          grep -E '^ruff==' requirements-test.txt > /tmp/ruff-req.txt
          pip install -r /tmp/ruff-req.txt

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        # Report-only: enforcing it today would mean reformatting half the
        # modules, which belongs in its own pull request.
        continue-on-error: true
        run: ruff format --check --diff .

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install the test harness
        run: pip install -r requirements-test.txt

      - name: pytest
        run: |
          pytest \
            --cov=custom_components/pronote \
            --cov-report=term-missing \
            --cov-report=xml \
            --junit-xml=junit.xml

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn
