name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      # Needed by action-gh-release to attach the asset. Scoped to this job.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set version number
        # The tag name goes through the environment, never through `${{ }}`
        # inside the script. `${{ }}` is substituted into the shell source
        # before it runs, so a tag containing a quote used to break the yq
        # expression, and a tag crafted on purpose could run its own commands
        # in a job that holds `contents: write`.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          yq -i -o json '.version = strenv(RELEASE_TAG)' \
            custom_components/pronote/manifest.json
          # Fail loudly if the version did not land, rather than shipping a
          # zip that still claims the placeholder version.
          test "$(yq -o json -r '.version' custom_components/pronote/manifest.json)" = "$RELEASE_TAG"

      - name: Pack the integration
        run: |
          cd custom_components/pronote
          zip pronote.zip -r ./ -x '*__pycache__*' -x '*.pyc'

      - name: Upload the zip to the release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: custom_components/pronote/pronote.zip
