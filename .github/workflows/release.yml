name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set version number
        # The tag goes through the environment, not `${{ }}` in the script.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          yq -i -o json '.version = strenv(RELEASE_TAG)' \
            custom_components/pronote/manifest.json
          test "$(yq -o json -r '.version' custom_components/pronote/manifest.json)" = "$RELEASE_TAG"

      - name: Pack the integration
        run: |
          cd custom_components/pronote
          zip pronote.zip -r ./ -x '*__pycache__*' -x '*.pyc'

      - name: Upload the zip to the release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: custom_components/pronote/pronote.zip
