# Ruff configuration for the Pronote integration.
#
# The rule set below is deliberately broad, and each existing module is
# exempted from exactly the rules it breaks today - no more. That way the pull
# request introducing linting stays green, while any *new* violation (a new
# file, or a rule a file does not already break) fails the build. The
# per-file lists are a debt ledger meant to shrink: removing one entry is a
# small, reviewable pull request of its own.
#
# Rules worth keeping in mind for this integration in particular:
#
#   ASYNC / LOG / G  Home Assistant runs everything on one event loop and
#                    pronotepy is synchronous. ASYNC catches a blocking call
#                    that slipped out of an executor job. G catches f-strings
#                    handed to a logger, which is how values reach the log
#                    that nobody meant to put there.
#   DTZ              Pronote sends naive datetimes in the school's local time.
#                    DTZ005 flags `datetime.now()`, which reads the *host*
#                    clock instead - a real defect in `coordinator.py` and
#                    `calendar.py` today, and the reason this family is
#                    enabled rather than ignored outright.

target-version = "py314"
line-length = 88

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "RET",    # flake8-return
    "ASYNC",  # flake8-async
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "DTZ",    # flake8-datetimez
    "T20",    # no print()
    "RUF",    # ruff-specific
]

[lint.per-file-ignores]
# Existing debt, recorded file by file against the tree at the time this was
# introduced. Do not add to these lists; remove from them.
"custom_components/pronote/__init__.py" = ["I001"]
"custom_components/pronote/calendar.py" = [
    "DTZ005", "E712", "F401", "I001", "RET501",
]
"custom_components/pronote/config_flow.py" = [
    "E402", "E501", "F401", "F403", "F405", "I001", "RET505",
]
"custom_components/pronote/coordinator.py" = [
    "DTZ005", "DTZ011", "E501", "F403", "F405", "G004", "I001", "RET504",
    "RET508", "SIM105", "W291", "W293",
]
"custom_components/pronote/pronote_formatter.py" = ["F401", "I001"]
"custom_components/pronote/pronote_helper.py" = [
    "E402", "E501", "G004", "I001",
]
"custom_components/pronote/pronotepy_hotfix.py" = [
    "B904", "E501", "I001", "RET505", "SIM210", "UP045",
]
"custom_components/pronote/sensor.py" = [
    "DTZ007", "E501", "E714", "F403", "F405", "I001", "RET505", "RUF013",
]
"custom_components/pronote/server_status.py" = ["I001", "UP041"]

# Not debt: the test fixtures build naive datetimes on purpose, because that
# is exactly what pronotepy hands the integration. Making them aware would
# test something the code never sees.
"tests/*" = ["DTZ001"]
